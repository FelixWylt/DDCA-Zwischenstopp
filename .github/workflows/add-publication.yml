name: Add series to the INDUCKS catalogue

# Started by the app's "Add to catalogue" button: it opens an issue titled
# "Add to catalogue: <INDUCKS code>" with the series name in the body.
# Only issues opened by the repository owner are acted on. The series is added to
# catalogue/publications.json and the catalogue is rebuilt.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  add:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Add to catalogue:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the series to the list
        id: add
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import json, os, re
          title, body = os.environ["TITLE"], os.environ.get("BODY") or ""
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          CODE = r"[a-z]{2}/[A-Za-z0-9]{1,12}"
          clean = lambda n: re.sub(r"[^\w\s&:'.,!()\-+/äöüåÄÖÜÅéèàìòù]", "", n).strip()[:80]
          # several series: one line per series in the body, "<code> = <name>"; one series: the code in the title, "Series: <name>" in the body
          want = [(m.group(1), clean(m.group(2))) for m in re.finditer(rf"^\s*({CODE})\s*=\s*(.+?)\s*$", body, re.M)]
          if not want:
              m = re.search(rf"Add to catalogue:\s*({CODE})\s*$", title)
              if m: want = [(m.group(1), clean((re.search(r"^Series:\s*(.+)$", body, re.M) or [None, m.group(1)])[1]))]
          if not want:
              out.write("result=bad\n"); raise SystemExit(0)
          p = "catalogue/publications.json"
          cfg = json.load(open(p, encoding="utf-8"))
          have = {t.get("code") for t in cfg["targets"]}
          added = []
          for code, name in want[:60]:
              if code in have: continue
              cfg["targets"].append({"series": name or code, "country": code.split("/")[0], "code": code, "title": name or code}); have.add(code); added.append(code)
          if not added:
              out.write("result=exists\ncode=" + ", ".join(c for c, _ in want) + "\n"); raise SystemExit(0)
          json.dump(cfg, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2); open(p, "a").write("\n")
          out.write("result=added\ncode=" + ", ".join(added) + "\n")
          PY

      - name: Commit and rebuild the catalogue
        if: steps.add.outputs.result == 'added'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.add.outputs.code }}
        run: |
          git config user.name "catalogue-bot"; git config user.email "catalogue-bot@users.noreply.github.com"
          git add catalogue/publications.json
          git commit -m "Catalogue: add $CODE (requested in the app)"
          git push
          # a push made by this job doesn't start other workflows, so the rebuild is started by hand
          gh workflow run inducks-catalogue.yml --ref main

      - name: Answer and close the request
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          RESULT: ${{ steps.add.outputs.result }}
          CODE: ${{ steps.add.outputs.code }}
        run: |
          case "$RESULT" in
            added)  MSG="Added $CODE. The catalogue is being rebuilt (about 5 minutes); then the app offers an update." ;;
            exists) MSG="Already in the catalogue list: $CODE. Nothing to do." ;;
            *)      MSG="The title should be 'Add to catalogue: <INDUCKS code>', e.g. 'Add to catalogue: it/ABB'. Nothing was changed." ;;
          esac
          gh issue comment "$NUM" --body "$MSG"
          gh issue close "$NUM"
