name: cors-test
on:
  push:
    branches: [cors-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          exec > probe-result.txt 2>&1
          UA="DagobertDucksArchiv-probe/1.0 (personal collection app)"
          A="https://de.duckipedia.org/api.php?format=json&formatversion=2"
          curl -s -A "$UA" -G "$A" --data-urlencode action=parse --data-urlencode page="Ausgabenliste Donald Duck Taschenbuch" --data-urlencode prop=wikitext > al.json
          python3 - <<'EOF'
          import json, re
          t = json.load(open('al.json'))['parse']['wikitext']
          print(t[:1500])
          print('---- lines with Test/Probe/0x')
          for l in t.split('\n'):
              if re.search(r'test|probe|\[\[DD 0|DD 0\d', l, re.I): print(l[:300])
          print('---- links'); print(sorted(set(re.findall(r'\[\[([^\]|]+)', t)))[:80])
          EOF
          curl -s -A "$UA" -G "$A" --data-urlencode action=query --data-urlencode list=allpages --data-urlencode apprefix="DD 0" --data-urlencode aplimit=20; echo
          curl -s -A "$UA" -G "$A" --data-urlencode action=query --data-urlencode list=search --data-urlencode srsearch="Donald Duck Taschenbuch Testausgabe" --data-urlencode srlimit=10; echo
      - name: Save
        if: always()
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
