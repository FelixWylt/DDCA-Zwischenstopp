name: cors-test
on:
  push:
    branches: [cors-test]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check CORS headers of book databases
        run: |
          O="Origin: https://felixwylt.github.io"
          for u in \
            "https://openlibrary.org/api/books?bibkeys=ISBN:9783423214124&jscmd=data&format=json" \
            "https://openlibrary.org/search.json?q=tintenherz&limit=2" \
            "https://covers.openlibrary.org/b/isbn/9783423214124-M.jpg" \
            "https://www.googleapis.com/books/v1/volumes?q=isbn:9783423214124" \
            "https://services.dnb.de/sru/dnb?version=1.1&operation=searchRetrieve&query=isbn%3D9783423214124&recordSchema=MARC21-xml" \
            "https://libris.kb.se/xsearch?query=isbn:9789129697742&format=json" \
            "http://libris.kb.se/xsearch?query=isbn:9789129697742&format=json" \
            "https://libris.kb.se/find.jsonld?q=9789129697742" \
            ; do
            echo "=== $u"
            curl -s -D - -o body.txt -H "$O" -L --max-time 20 "$u" | grep -iE "^HTTP|access-control-allow-origin|content-type|location" || true
            head -c 600 body.txt; echo
          done
