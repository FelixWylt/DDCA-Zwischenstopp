name: cors-test
on:
  push:
    branches: [cors-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          exec > probe-result.txt 2>&1
          UA="DagobertDucksArchiv-probe/1.0"
          curl -s -L -A "$UA" -o isv.tgz https://inducks.org/inducks/isv.tgz && mkdir -p isv && tar -xzf isv.tgz -C isv --strip-components=1
          echo "=== entries"; grep '^se/KAPS2017-05' isv/inducks_entry.isv | cut -d^ -f1-3,6,9 | head
          echo "=== urls"; grep '^se/KAPS2017-05' isv/inducks_entryurl.isv
          echo "=== issueurl"; head -1 isv/inducks_issueurl.isv; grep 'se/KAPS2017-05' isv/inducks_issueurl.isv | head
          for sv in $(grep '^se/KAPS2017-05' isv/inducks_entry.isv | cut -d^ -f3 | head -3); do grep -m1 "^$sv^" isv/inducks_storyversion.isv | cut -d^ -f1,2,7; done
          echo "=== issues without cover in catalogue series: entryurl sitecodes of their 'a' entries (sample)"
          for ic in "se/KAPS2017-05" "de/LTB  546A"; do grep "^$ic" isv/inducks_entryurl.isv | head -3; done
          for u in $(grep '^se/KAPS2017-05' isv/inducks_entryurl.isv | cut -d^ -f2,4 | head -4); do s=${u%%^*}; p=${u#*^}; base=$(grep "^$s^" isv/inducks_site.isv | cut -d^ -f2); echo "-- $base$p"; curl -s -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" "https://inducks.org/hr.php?image=$base$p&normalsize=1"; done
      - name: Save
        if: always()
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
