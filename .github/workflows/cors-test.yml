name: cors-test
on:
  push:
    branches: [cors-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          exec > probe-result.txt 2>&1
          A="https://de.duckipedia.org/api.php?format=json&formatversion=2"
          UA="DagobertDucksArchiv-probe/1.0 (personal collection app)"
          O="Origin: https://felixwylt.github.io"
          h() { echo "-- $1"; curl -s -I -L -A "$UA" -H "$O" "$1" | grep -i 'access-control\|^HTTP\|content-type\|content-length'; }
          echo "=== Duckipedia imageinfo"
          curl -s -A "$UA" -G "$A" --data-urlencode action=query --data-urlencode titles="Datei:LTB 100.JPG|Datei:LTB 001.jpg" --data-urlencode prop=imageinfo --data-urlencode iiprop=url --data-urlencode iiurlwidth=200 | tee ii.json; echo
          for u in $(python3 -c "import json;d=json.load(open('ii.json'));[print(p['imageinfo'][0].get('thumburl','')) for p in d['query']['pages'] if 'imageinfo' in p]"); do h "$u"; done
          echo "=== outducks"
          for u in https://outducks.org/thumbnails/se/kap/se_kap_001a_001.jpg https://outducks.org/thumbnails/webusers/2018/09/se_kap_001a_001.jpg https://outducks.org/webusers/webusers/2018/09/se_kap_001a_001.jpg "https://wsrv.nl/?url=outducks.org/webusers/webusers/2018/09/se_kap_001a_001.jpg&w=200&output=jpg"; do h "$u"; done
          echo "=== sites"
          curl -s -L -A "$UA" -o isv.tgz https://inducks.org/inducks/isv.tgz && mkdir -p isv && tar -xzf isv.tgz -C isv --strip-components=1 inducks_entryurl.isv inducks_site.isv 2>/dev/null || tar -xzf isv.tgz -C isv --strip-components=1
          cut -d^ -f2 isv/inducks_entryurl.isv | sort | uniq -c | sort -rn | head -12
          grep -E '^(se|de|it|no)\^' isv/inducks_site.isv
          grep -m4 '^de/LTB  546' isv/inducks_entryurl.isv; grep -m4 '^de/MM1990-' isv/inducks_entryurl.isv
      - name: Save
        if: always()
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
