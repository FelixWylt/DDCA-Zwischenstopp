name: cors-test
on:
  push:
    branches: [cors-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          exec > probe-result.txt 2>&1
          python3 probe.py
      - name: Save
        if: always()
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
