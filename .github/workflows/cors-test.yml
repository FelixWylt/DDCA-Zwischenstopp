name: cors-test
on:
  push:
    branches: [cors-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          exec > probe-result.txt 2>&1
          A="https://de.duckipedia.org/api.php?format=json&formatversion=2"
          UA="DagobertDucksArchiv-probe/1.0 (personal collection app)"
          q() { curl -s -A "$UA" -G "$A" "$@"; echo; }
          echo "=== LTB 100 wikitext head"
          q --data-urlencode action=parse --data-urlencode page="LTB 100" --data-urlencode prop=wikitext | python3 -c "import sys,json; print(json.load(sys.stdin)['parse']['wikitext'][:1500])"
          echo "=== pageimages"
          q --data-urlencode action=query --data-urlencode titles="LTB 100|LTB 500" --data-urlencode prop="pageimages|images" --data-urlencode piprop="thumbnail|name" --data-urlencode pithumbsize=300
          echo "=== series page Lustiges Taschenbuch"
          q --data-urlencode action=query --data-urlencode titles="Lustiges Taschenbuch" --data-urlencode prop="extracts|pageimages" --data-urlencode exintro=1 --data-urlencode explaintext=1 --data-urlencode exsentences=3 --data-urlencode redirects=1 | head -c 1500
          echo; echo "=== series page wikitext"
          q --data-urlencode action=parse --data-urlencode page="Lustiges Taschenbuch" --data-urlencode redirects=1 --data-urlencode prop=wikitext | python3 -c "import sys,json; print(json.load(sys.stdin)['parse']['wikitext'][:2500])"
          echo "=== INDUCKS"
          mkdir -p isv && curl -s -L --user-agent "DagobertDucksArchiv-probe" -o isv.tgz https://inducks.org/inducks/isv.tgz && tar -xzf isv.tgz -C isv --strip-components=1
          ls isv | tr '\n' ' '; echo
          for t in inducks_publication inducks_issue inducks_entry inducks_entryurl inducks_site inducks_publisher inducks_publishingjob inducks_storyversion; do echo "--- $t"; head -2 isv/$t.isv 2>/dev/null; done
          grep -m3 '^de/LTB  100' isv/inducks_entryurl.isv; grep -m5 '^de/LTB  100' isv/inducks_entry.isv; grep -m3 '^se/KAP  1a\|^se/KAP   1' isv/inducks_entryurl.isv
          grep -m3 '^de/LTB  500' isv/inducks_entryurl.isv; grep '^de/LTB\^' isv/inducks_publishingjob.isv | head -3; grep -m2 '^de/LTB\^' isv/inducks_publication.isv
          grep -m8 'webusers\|thumbnails' isv/inducks_site.isv; head -15 isv/inducks_site.isv
          echo "=== CORS"
          for u in "https://de.duckipedia.org/images/thumb/" "https://outducks.org/" "https://inducks.org/hr.php" "https://wsrv.nl/?url=outducks.org/webusers/webusers/2015/03/de_ltb_100a_001.jpg&w=200"; do echo "-- $u"; curl -s -I -H "Origin: https://felixwylt.github.io" "$u" | grep -i 'access-control\|^HTTP\|content-type'; done
      - name: Save
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
