name: cors-test
on:
  push:
    branches: [cors-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          exec > probe-result.txt 2>&1
          A="https://de.duckipedia.org/api.php?format=json&formatversion=2"
          UA="DagobertDucksArchiv-probe/1.0 (personal collection app)"
          O="Origin: https://felixwylt.github.io"
          h() { echo "-- $1"; curl -s -I -L -A "$UA" -H "$O" "$1" | grep -i 'access-control\|^HTTP\|content-type\|content-length'; }
          g() { echo "-- $1"; curl -s -o /tmp/x -D - -L -A "Mozilla/5.0 (Linux; Android 14) Mobile" -H "$O" "$1" | grep -i 'access-control\|^HTTP\|content-type\|content-length'; file /tmp/x | cut -c1-120; }
          for u in https://outducks.org/se/kap/se_kap_001a_001.jpg https://outducks.org/de/mm/mm1990/de_mm1990_11a_001.jpg https://outducks.org/thumbnails/de/mm/mm1990/de_mm1990_11a_001.jpg https://outducks.org/thumbnails2/de/mm/mm1990/de_mm1990_11a_001.jpg "https://inducks.org/hr.php?image=https://outducks.org/de/mm/mm1990/de_mm1990_11a_001.jpg&normalsize=1" "https://wsrv.nl/?url=outducks.org/de/mm/mm1990/de_mm1990_11a_001.jpg&w=240&output=webp&q=70" "https://wsrv.nl/?url=de.duckipedia.org/images/thumb/5/57/LTB_001.jpg/200px-LTB_001.jpg&w=240&output=webp&q=70"; do g "$u"; done
      - name: Save
        if: always()
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
