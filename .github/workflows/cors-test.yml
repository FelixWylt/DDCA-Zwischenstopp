name: cors-test
on:
  push:
    branches: [cors-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          exec > probe-result.txt 2>&1
          A="https://de.duckipedia.org/api.php?format=json&formatversion=2"
          UA="DagobertDucksArchiv-probe/1.0 (personal collection app)"
          for p in "LTB " "Lustiges Taschenbuch " "Micky Maus" "MM " "Mega" "Donald Duck" "DD " "Panzerknacker" "Mammut" "Entenhausen" "TGDD" "Die tollsten" "MMC" "MMP" "MMT" "LTB Premium" "LTB Sonderband" "LTB Spezial" "Lustiges Taschenbuch Sonderband" "LTB Ultimate" "LTB Young" "LTB Crime" "LTB Enten" "LTB Royal" "LTB Weltreise" "LTB Classic" "LTB Extra" "LTB präsentiert" "LTB Entenhausen" "LTB Sonderedition" "LTB Halloween" "LTB Advent" "LTB Ostern" "LTB Winter" "LTB Weihnachten"; do
            echo "=== prefix: $p"
            curl -s -A "$UA" -G "$A" --data-urlencode "action=query" --data-urlencode "list=allpages" --data-urlencode "apprefix=$p" --data-urlencode "aplimit=40" | python3 -c "import sys,json; print([x['title'] for x in json.load(sys.stdin)['query']['allpages']])"
          done
          for s in "Lustiges Taschenbuch Premium" "Lustiges Taschenbuch Crime" "Micky Maus 1952" "Micky Maus Heft" "Mammut Comics" "Donald Duck Taschenbuch" "Panzerknacker & Co" "Lustiges Taschenbuch Sonderband Weihnachten" "Micky Maus Zeitung"; do
            echo "=== search: $s"
            curl -s -A "$UA" -G "$A" --data-urlencode "action=query" --data-urlencode "list=search" --data-urlencode "srsearch=$s" --data-urlencode "srlimit=12" | python3 -c "import sys,json; print([x['title'] for x in json.load(sys.stdin)['query']['search']])"
          done
          echo "=== INDUCKS"
          mkdir -p isv && curl -s -L --user-agent "DagobertDucksArchiv-probe" -o isv.tgz https://inducks.org/inducks/isv.tgz && tar -xzf isv.tgz -C isv --strip-components=1
          python3 - <<'PY'
          import csv,sys,re
          def rows(t):
              f=open('isv/'+t+'.isv',encoding='utf-8',errors='replace'); h=f.readline().rstrip('\n').split('^')
              for l in f: yield dict(zip(h,l.rstrip('\n').split('^')))
          pubs={r['publicationcode']:r for r in rows('inducks_publication')}
          for r in pubs.values():
              t=r['title'].lower()
              if 'musik' in t or 'julsaga' in t or ('saga' in t and r['countrycode'] in ('se','no','dk')): print('PUB',r['publicationcode'],r['title'],r['countrycode'])
          for r in rows('inducks_issue'):
              t=(r.get('title') or '').lower()
              if ('julsaga' in t or 'musiksaga' in t or 'musik' in t) and r['issuecode'][:3] in ('se/','no/','dk/'): print('ISS',r['issuecode'],r['title'],r.get('oldestdate'))
          PY
      - name: Save
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
