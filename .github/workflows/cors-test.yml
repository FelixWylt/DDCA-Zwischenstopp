name: cors-test
on:
  push:
    branches: [cors-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          exec > probe-result.txt 2>&1
          UA="DagobertDucksArchiv-probe/1.0"
          curl -s -L -A "$UA" -o isv.tgz https://inducks.org/inducks/isv.tgz && mkdir -p isv && tar -xzf isv.tgz -C isv --strip-components=1
          echo "=== FDLL publication"; grep -i '^it/FDL' isv/inducks_publication.isv | head
          echo "=== FDLL issues"; grep -c '^[^^]*^[^^]*^it/FDLL^' isv/inducks_issue.isv; grep '^it/FDLL' isv/inducks_issue.isv | head -3
          echo "=== trilioni issues"; grep -i 'trilioni' isv/inducks_issue.isv | head
          echo "=== trilioni publications"; grep -i 'trilioni' isv/inducks_publication.isv | head
          echo "=== trilioni entries (first 10)"; grep -i 'trilioni di paperone' isv/inducks_entry.isv | cut -d^ -f1,2,9 | head -10
          echo "=== Gatti covers 1977 it"; grep -i '^it/' isv/inducks_issue.isv | grep '\^1977' | grep -i 'paperone' | head
      - name: Save
        if: always()
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
