name: cors-test
on:
  push:
    branches: [cors-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          exec > probe-result.txt 2>&1
          UA="DagobertDucksArchiv-probe/1.0"
          curl -s -L -A "$UA" -o isv.tgz https://inducks.org/inducks/isv.tgz && mkdir -p isv && tar -xzf isv.tgz -C isv --strip-components=1
          echo "=== pubs FDL"; grep -i '^it/FDL\|\^it\^.*fdl' isv/inducks_publication.isv | cut -d^ -f1-5 | head
          echo "=== it pubs total"; grep -c '^it/' isv/inducks_publication.isv
          echo "=== issues trilioni"; grep -i 'trilioni' isv/inducks_issue.isv | cut -d^ -f1,3,4,5,11 | head -20
          echo "=== pubs trilioni"; grep -i 'trilioni' isv/inducks_publication.isv | cut -d^ -f1-5 | head
          echo "=== MM 2017-23"; grep '^de/MM2017-2[2-5]' isv/inducks_issue.isv | cut -d^ -f1,3,4,11 | head
      - name: Save
        if: always()
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add probe-result.txt; git commit -m "probe result [skip ci]"; git push
