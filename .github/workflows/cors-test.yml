name: cors-test
on:
  push:
    branches: [cors-test]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CORS headers of book databases
        run: |
          exec > cors-result.txt 2>&1
          O="Origin: https://felixwylt.github.io"
          curl -s "https://libris.kb.se/xsearch?query=pippi%20l%C3%A5ngstrump%20lindgren&format=json&n=3" ; echo
          I=$(curl -s "https://libris.kb.se/xsearch?query=pippi%20l%C3%A5ngstrump%20lindgren&format=json&n=10" | grep -oE '"isbn":"[0-9X]{10,13}' | head -1 | cut -d'"' -f4); echo "ISBN=$I"
          curl -s "https://libris.kb.se/xsearch?query=isbn:$I&format=json" ; echo
          curl -s "https://services.dnb.de/sru/dnb?version=1.1&operation=searchRetrieve&query=isbn%3D9783423214124&recordSchema=MARC21-xml"; echo
          curl -s "https://services.dnb.de/sru/dnb?version=1.1&operation=searchRetrieve&query=tit%3Dtintenherz%20and%20per%3Dfunke&recordSchema=MARC21-xml&maximumRecords=2" | head -c 3000; echo
      - name: Save result
        run: |
          git config user.name "cors-test"; git config user.email "cors-test@users.noreply.github.com"
          git add cors-result.txt; git commit -m "CORS result [skip ci]"; git push
