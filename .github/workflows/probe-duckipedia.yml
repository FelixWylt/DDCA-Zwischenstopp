name: Probe Duckipedia (one-off)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/probe_duckipedia.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/probe_duckipedia.py
      - name: Commit findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe
          git diff --cached --quiet && exit 0
          git commit -m "Duckipedia probe results"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done; exit 1
